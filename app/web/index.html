<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research-to-Report</title>
  <style>
    :root { --bg: #eef0f3; --surface: #fff; --ink: #1d2433; --muted: #667085; --line: #dde2e8; --accent: #1f4e9c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .topbar { display: flex; align-items: center; gap: 16px; height: 44px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 10; }
    .brand { font-weight: 600; } .muted { color: var(--muted); } .status { margin-left: auto; color: var(--muted); font-size: 12px; }
    .body { flex: 1; display: flex; min-height: 0; }
    .rail { width: 160px; padding: 12px; background: #f7f8fa; border-right: 1px solid var(--line); position: relative; z-index: 10; }
    .thumb { aspect-ratio: 16 / 9; background: var(--surface); border: 2px solid var(--accent); display: flex; align-items: flex-end; padding: 4px; font-size: 11px; color: var(--muted); }
    .stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .sheet { position: relative; background: var(--surface); box-shadow: 0 1px 3px rgba(16, 24, 40, .12); }
    .panel { width: 360px; padding: 16px; background: var(--surface); border-left: 1px solid var(--line); position: relative; z-index: 10; }
    .error { position: absolute; top: 16px; color: #b42318; }
    button { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    a.brand { color: var(--ink); text-decoration: none; }
    .topbar button { padding: 4px 9px; }
    .picker { max-width: 760px; margin: 48px auto; padding: 0 16px; } .picker h1 { font-size: 22px; } .picker .row { display: flex; gap: 8px; flex-wrap: wrap; } .picker li { margin: 8px 0; }
    .rail { overflow-y: auto; } .thumb { position: relative; width: 136px; height: 76.5px; margin-bottom: 10px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; padding: 0; display: block; }
    .thumb.current { outline: 2px solid var(--accent); } .thumb span { position: absolute; left: 4px; bottom: 2px; font-size: 10px; color: var(--muted); }
    .thumb-canvas { transform-origin: 0 0; pointer-events: none; width: 150px; }
    .stage { flex-direction: column; gap: 10px; } .statusline { font-size: 12px; color: var(--muted); position: relative; z-index: 10; }
    .good { color: #067647; } .bad { color: #b42318; }
    .notice { position: absolute; top: 12px; z-index: 20; background: #1d2433; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; }
    .edit-overlay { position: absolute; box-sizing: border-box; border: 2px solid var(--accent); font: 13px "Liberation Sans", Helvetica, sans-serif; z-index: 5; }
    .panel { display: flex; flex-direction: column; overflow-y: auto; } .tabs { display: flex; gap: 4px; margin-bottom: 10px; } .tabs button { flex: 1; text-transform: capitalize; } .tabs button.on { background: #e8eef8; border-color: #c7d4ea; }
    .journal { padding-left: 18px; font-size: 12px; } .journal li { margin: 4px 0; } .journal li[data-actor="ai"] b { color: #6941c6; } .journal li[data-actor="research"] b { color: #b54708; }
    .claim { border-left: 3px solid #98a2b3; padding-left: 8px; margin-bottom: 8px; font-size: 12px; } .claim.supported { border-color: #12b76a; } .claim.mismatch { border-color: #f04438; }
    .format { display: inline-flex; gap: 2px; margin-left: 8px; } .format button { width: 28px; padding: 3px 0; } .fmt-bold { font-weight: 700; } .fmt-italic { font-style: italic; } .fmt-underline { text-decoration: underline; }
    .align { display: inline-flex; gap: 2px; margin-left: 8px; } .align button { padding: 3px 7px; font-size: 13px; line-height: 1; }
    /* Bullet layout for GenOffice's TextEditOverlay — from genoffice apps/slides/src/renderer/styles.css (Apache-2.0) */
    .slide-text-editor { outline: none; }
    .slide-text-editor > div[data-bullet-text]::before { content: attr(data-bullet-text); display: inline-block; margin-left: calc(-1 * var(--bullet-hang)); width: var(--bullet-w); line-height: 0; font-family: var(--bullet-font, inherit); font-size: var(--bullet-size, inherit); font-weight: var(--bullet-weight, normal); color: var(--bullet-color, inherit); }
    .slide-text-editor > div[data-bullet-img] { position: relative; }
    .slide-text-editor > div[data-bullet-img]::after { content: ''; position: absolute; left: var(--bullet-x); top: var(--bullet-y); width: var(--bullet-img-w); height: var(--bullet-h); background: var(--bullet-img) center / contain no-repeat; user-select: none; pointer-events: none; }
    .tabs { flex-wrap: wrap; } .tabs button { flex: 1 0 30%; padding: 4px 6px; font-size: 12px; }
    button.link { border: none; background: none; color: var(--accent); padding: 0 4px; text-decoration: underline; font-size: inherit; }
    .small { font-size: 11px; } .evidence, .data { font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
    .ev-series h4 { margin: 8px 0 4px; font-size: 12px; } .num { border-left: 3px solid #12b76a; padding: 2px 0 2px 8px; margin-bottom: 3px; }
    .num.stale, .num.unsourced { border-color: #f04438; } .num.edited { border-color: #f79009; } .num.verified-edit { border-color: #2e90fa; }
    .num summary { cursor: pointer; } .num-v { font-weight: 600; font-variant-numeric: tabular-nums; } .badge { margin-left: 6px; font-size: 10px; text-transform: uppercase; color: #b42318; }
    .ev-card { background: #f6f8fb; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 4px 0; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
    .ev-q a { color: var(--accent); font-size: 11px; } .formula { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: #eef2f7; padding: 1px 4px; border-radius: 3px; }
    .ev-input { margin-left: 6px; } .ev-input .ev-card { margin-left: 8px; }
    .grid { border-collapse: collapse; width: 100%; } .grid th, .grid td { border-bottom: 1px solid var(--line); padding: 3px 4px; text-align: left; } .grid td.n { text-align: right; font-variant-numeric: tabular-nums; }
    .grid input { width: 64px; text-align: right; font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; } .grid tr.edited td { background: #fffaeb; } .grid tr.verified td { background: #eff8ff; }
    .grid button { padding: 1px 6px; font-size: 11px; margin-right: 2px; } .data select { font: inherit; padding: 3px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(16, 24, 40, .35); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--surface); border-radius: 10px; padding: 18px 20px; width: 520px; max-width: calc(100vw - 32px); max-height: 80vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .modal h3 { margin: 0; } .seg { display: flex; gap: 4px; } .seg button { flex: 1; } .seg button.on { background: #e8eef8; border-color: #c7d4ea; }
    .ack { display: flex; gap: 8px; align-items: flex-start; } .block { border-left: 3px solid #f04438; padding-left: 8px; } .row.end { justify-content: flex-end; display: flex; gap: 8px; }
  </style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
