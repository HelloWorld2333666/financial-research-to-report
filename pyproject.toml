[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-to-report"
version = "0.1.0"
description = "Evidence-grounded financial research records for future slide generation (Phase 0)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["pypdf>=4"]

[project.scripts]
frr = "frr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "editor/tests"]
