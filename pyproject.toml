[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-to-report"
version = "0.1.0"
description = "Evidence-grounded financial research records for future slide generation (Phase 0)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["pypdf>=4"]
app = ["starlette>=0.40", "uvicorn>=0.30", "httpx2>=2.16", "pydantic-ai-slim[ag-ui]==2.64.0", "openai>=3.31,<4"]

[project.scripts]
frr = "frr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "editor/tests", "app/server/tests"]
